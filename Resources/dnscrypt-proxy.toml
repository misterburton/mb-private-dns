# Private DNS: HTTPS only. Fixed server IPs avoid plaintext bootstrap DNS.
server_names = ['cloudflare-primary', 'cloudflare-secondary']
listen_addresses = ['127.0.0.1:53']
max_clients = 250
ipv4_servers = true
ipv6_servers = false
dnscrypt_servers = false
doh_servers = true
odoh_servers = false
require_nolog = true
require_nofilter = true
require_dnssec = true
ignore_system_dns = true
bootstrap_resolvers = []
netprobe_timeout = 0
http3 = false
timeout = 5000
keepalive = 30
cache = true
cache_size = 4096
cache_min_ttl = 60
cache_max_ttl = 86400
block_unqualified = true
block_undelegated = true
log_level = 2
use_syslog = true

[static.'cloudflare-primary']
stamp = 'sdns://AgcAAAAAAAAABzEuMS4xLjEAEmNsb3VkZmxhcmUtZG5zLmNvbQovZG5zLXF1ZXJ5'

[static.'cloudflare-secondary']
stamp = 'sdns://AgcAAAAAAAAABzEuMC4wLjEAEmNsb3VkZmxhcmUtZG5zLmNvbQovZG5zLXF1ZXJ5'

